[project]
name = "discrete-flow-sampler"
version = "0.1.0"
description = "Discrete neural flow samplers with constraints for materials discovery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*.txt"]
authors = [{name = "Mitchell Crabb", email = "mitchcrabb@tutamail.com"}]
requires-python = ">= 3.11"
dependencies = ["icet>=3.2,<4"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/discrete_flow_sampler"]

[tool.hatch.build.targets.sdist]
# Hatch does not read .git/info/exclude, where local research notes are ignored.
include = [
    "/src", "/tests", "/experiments", "/scripts", "/slurm",
    "/assets", "/checkpoints", "/data", "/icet-ce", "/notebooks",
    "/README.md", "/LICENSE", "/LICENSES", "/THIRD_PARTY_NOTICES.md",
    "/pyproject.toml", "/pixi.lock", "/.gitignore", "/.gitattributes",
]
exclude = ["**/.claude"]

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
discrete-flow-sampler = { path = ".", editable = true }
wandb = ">=0.18,<1"
modal = ">=0.77"

[tool.pixi.tasks]
# Parallel by default: the suite is dominated by a handful of long swap-leg
# tests (bit-exact resume alone is ~43 s), so wall-clock is ~290 s serial vs
# ~77 s across 12 workers. `worksteal` beats the default round-robin here
# because the durations are very uneven. conftest.py already pins torch to
# one thread, so workers do not oversubscribe the cores.
test = "pytest tests/ -q -n auto --dist worksteal"
# Serial escape hatch: use when you need pdb, live output, or to rule out a
# cross-test interaction that only appears under parallelism.
test-serial = "pytest tests/ -v"
lint = "ruff check src/ experiments/ tests/ scripts/"
format = "ruff format src/ experiments/ tests/ scripts/"
jupyter = "jupyter lab"

[tool.pixi.dependencies]
python = "3.11.*"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.8,<4"
ase = ">=3.28.0,<4"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.2.0,<8"
pandas = ">=3.0.2,<4"
pytorch = ">=2.10.0,<3"

[tool.pixi.feature.dev.dependencies]
pytest = "*"
ruff = "*"
pytest-xdist = ">=3.8.0,<4"

# ---------------------------------------------
# CUDA Feature (used by the Modal image)
# ---------------------------------------------
# linux-64 only. Asserts cuda = 12.4 so pixi's solver picks the CUDA-
# tagged pytorch build from the conda-forge / pytorch channels rather
# than the CPU build the default solve picks. pytorch itself stays in
# the workspace base [tool.pixi.dependencies] so the `dev` env keeps
# its CPU torch on osx-arm64 and linux-64; the cuda feature only
# changes which *build* of pytorch the linux-64 solve resolves.
[tool.pixi.feature.cuda]
platforms = ["linux-64"]

[tool.pixi.feature.cuda.system-requirements]
cuda = "12.4"

# cuda-cudart-dev ships the CUDA toolkit headers (cuda.h) that triton's
# runtime C-shim build needs under torch.compile; the conda-forge triton
# build bundles no headers and the DoC nodes have no /usr/local/cuda, so
# compiled runs died with "cuda.h: No such file or directory" (Wave-1
# 278392/278393, 2026-08-25). Headers + static stubs only — no runtime
# library changes, lock delta verified additive-only.
[tool.pixi.feature.cuda.dependencies]
cuda-cudart-dev = ">=12.9.79,<13"

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }
cuda = { features = ["dev", "cuda"], solve-group = "cuda" }

[tool.ruff]
line-length = 88
src = ["src", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["discrete_flow_sampler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
