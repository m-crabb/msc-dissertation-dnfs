[project]
name = "discrete-flow-sampler"
version = "0.1.0"
description = "Discrete neural flow samplers with constraints for materials discovery"
authors = [{name = "Mitchell Crabb", email = "mitchcrabb@tutamail.com"}]
requires-python = ">= 3.11"
dependencies = ["icet>=3.2,<4"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/discrete_flow_sampler"]

[tool.pixi.workspace]
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64", "osx-arm64"]

[tool.pixi.pypi-dependencies]
discrete-flow-sampler = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest tests/ -v"
lint = "ruff check src/ experiments/"
format = "ruff format src/ experiments/"
jupyter = "jupyter lab"

[tool.pixi.dependencies]
python = "3.11.*"
numpy = ">=2.4.3,<3"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.8,<4"
ase = ">=3.28.0,<4"
jupyter = ">=1.1.1,<2"
ipykernel = ">=7.2.0,<8"
pandas = ">=3.0.2,<4"
tqdm = ">=4.67.3,<5"
pytorch = ">=2.10.0,<3"
torchvision = ">=0.26.0,<0.27"

[tool.pixi.feature.dev.dependencies]
pytest = "*"

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }

[tool.ruff]
line-length = 88
src = ["src", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["ruff", "pre-commit"]
